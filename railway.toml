[build]
builder = "railpack"
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = ["python manage.py migrate --noinput"]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -"
healthcheckPath = "/age-check/"
healthcheckTimeout = 100
